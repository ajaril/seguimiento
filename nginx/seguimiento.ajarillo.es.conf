server {
    server_name seguimiento.ajarillo.es;

    access_log /var/log/nginx/seguimiento.access.log;
    error_log  /var/log/nginx/seguimiento.error.log;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # certbot --nginx -d seguimiento.ajarillo.es añade el bloque 443 y la redirección
    listen 80;
    listen [::]:80;
}
